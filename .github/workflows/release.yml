# Release pipeline: on a v* tag, build the Windows MSI (windows-latest) and the
# Linux AppImage + deb (ubuntu-latest), and the unsigned macOS dmg (macos-latest),
# then publish one GitHub Release that the AppImage auto-updater reads.
#
# PREREQUISITES (one-time, owner-driven — see docs/superpowers/specs/2026-09-01-
# plexus-installer-design.md):
#   1. The @pragmatic-tech-ai/* framework packages (mural, fresco, todl, and
#      their transitive @pragmatic-tech-ai deps like todl-runtime) must be
#      published to GitHub Packages (https://npm.pkg.github.com) under the
#      pragmatic-tech-ai org. Local dev keeps using Verdaccio; CI reads them here.
#   2. Add a repo secret PACKAGES_TOKEN — a PAT with `read:packages` on the
#      pragmatic-tech-ai org. The default GITHUB_TOKEN is scoped to this repo's
#      owner (napryaglo) and cannot read another org's packages, so a separate
#      token is required for the npm install. GITHUB_TOKEN still creates the
#      Release (same repo, contents:write).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write   # create the GitHub Release
  packages: read    # read @pragmatic-tech-ai/* from GitHub Packages
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          # rollupNative: the @rollup/rollup-<platform> native binary this runner
          # needs. The committed lock (authored on Windows) lists only the win32
          # variants (npm/cli#4828), so Windows needs nothing extra; Linux/macOS
          # get theirs injected after npm ci. macos-latest is Apple Silicon (arm64).
          - os: ubuntu-latest
            args: --linux
            rollupNative: linux-x64-gnu
          - os: macos-latest
            args: --mac
            rollupNative: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CI registry wiring (the repo's committed .npmrc is gitignored and points
      # at local Verdaccio; this writes a CI-only one): public npm for OSS deps,
      # GitHub Packages for the @pragmatic-tech-ai scope.
      - name: Configure npm registries
        shell: bash
        run: |
          {
            printf 'registry=https://registry.npmjs.org/\n'
            printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n'
            printf '//npm.pkg.github.com/:_authToken=%s\n' "${PACKAGES_TOKEN}"
          } > .npmrc
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # `npm ci` (NOT `npm install`): the committed lock's @pragmatic-tech-ai
      # entries have no resolved URL, so a plain `npm install` re-resolves the
      # scope and drifts the dependency tree out from under plexus-core's tsc
      # (BuildStorageProviderKey / arg-count type errors). `npm ci` installs the
      # exact, build-correct locked tree.
      - name: Install (npm ci)
        shell: bash
        run: npm ci
      # The lock is authored on Windows, so npm recorded only the win32 rollup
      # native optional deps (npm/cli#4828); `npm ci` therefore leaves Linux/
      # macOS without their @rollup/rollup-<platform> binary and the Vite build
      # crashes ("Cannot find module @rollup/rollup-linux-x64-gnu"). Inject just
      # that leaf binary, at the version npm ci installed for rollup, with
      # --no-save --no-package-lock so the rest of the npm ci tree is untouched.
      - name: Add runner-native rollup binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ROLLUP_VER="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save --no-package-lock "@rollup/rollup-${{ matrix.rollupNative }}@${ROLLUP_VER}"
      - run: npm run build
      # electron-builder's config (apps/plexus/electron-builder.yml) and the
      # app manifest it reads (main = ./out/main/index.js) are both relative to
      # apps/plexus. Run it there, not at the monorepo root — at the root it
      # picks up the workspace package (plexus-workspace, no main) and fails the
      # asar entry-file check. npm run build (root script) still builds core +
      # app into apps/plexus/out before this step.
      - name: Package + publish
        shell: bash
        working-directory: apps/plexus
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
